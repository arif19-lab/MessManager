name: mess_manager
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  image_picker: ^1.1.2
  google_fonts: ^8.1.0
  device_preview: ^1.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  shelf: ^1.4.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  sqflite_common_ffi: ^2.3.4
  sqflite_common: ^2.5.11
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.13.0
  printing: ^5.15.0
  bangla_pdf_fixer: ^2.0.0
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/google_sign_in.html







flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.jpg"
  windows:
    generate: true
    image_path: "assets/app_icon.jpg"
  web:
    generate: true
    image_path: "assets/app_icon.jpg"
    background_color: "#0F172A"
    theme_color: "#0F172A"
